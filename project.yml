# Generate BetterSound.xcodeproj with: xcodegen generate
name: BetterSound
options:
  bundleIdPrefix: com.bettersound
  deploymentTarget:
    macOS: "14.4"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    DEVELOPMENT_TEAM: H8HKVKKHWL
packages:
  BetterSoundKit:
    path: Packages/BetterSoundKit
targets:
  BetterSound:
    type: application
    platform: macOS
    sources:
      - path: BetterSound
    dependencies:
      - package: BetterSoundKit
    info:
      path: BetterSound/Info.plist
      properties:
        CFBundleDisplayName: BetterSound
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAudioCaptureUsageDescription: BetterSound processes your Mac's sound output to boost volume and apply equalization. Audio never leaves your Mac.
    entitlements:
      path: BetterSound/BetterSound.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bettersound.mac
        PRODUCT_NAME: BetterSound
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
schemes:
  BetterSound:
    build:
      targets:
        BetterSound: all
    run:
      config: Debug
    archive:
      config: Release
