# Generate Decibel.xcodeproj with: xcodegen generate
name: Decibel
options:
  bundleIdPrefix: io.github.broisnischal
  deploymentTarget:
    macOS: "14.4"
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.4"
    DEVELOPMENT_TEAM: H8HKVKKHWL
packages:
  DecibelKit:
    path: Packages/DecibelKit
targets:
  Decibel:
    type: application
    platform: macOS
    sources:
      - path: Decibel
    dependencies:
      - package: DecibelKit
      - target: NowPlayingHelper
        embed: true
        link: false
        codeSign: true
    info:
      path: Decibel/Info.plist
      properties:
        CFBundleDisplayName: Decibel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        NSAudioCaptureUsageDescription: Decibel processes your Mac's sound output to boost volume and apply equalization. Audio never leaves your Mac.
    entitlements:
      path: Decibel/Decibel.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.broisnischal.decibel
        PRODUCT_NAME: Decibel
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        COMBINE_HIDPI_IMAGES: YES
        DEAD_CODE_STRIPPING: YES
  # Loaded into /usr/bin/perl at runtime to reach MediaRemote (see NowPlayingHelper/BSNowPlaying.m).
  NowPlayingHelper:
    type: framework
    platform: macOS
    sources:
      - path: NowPlayingHelper
    settings:
      base:
        PRODUCT_NAME: BSNowPlaying
        PRODUCT_BUNDLE_IDENTIFIER: io.github.broisnischal.decibel.nowplaying
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: NO
        CLANG_ENABLE_OBJC_ARC: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        OTHER_LDFLAGS: -framework Foundation -framework ImageIO -framework CoreGraphics
schemes:
  Decibel:
    build:
      targets:
        Decibel: all
    run:
      config: Debug
    archive:
      config: Release
